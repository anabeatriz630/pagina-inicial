<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div style="width: 300px; margin: 50px auto; font-family: Arial, sans-serif;">
        <h2>Login / Cadastro</h2>

        <p>Usuário:</p>
        <input type="text" id="txUsuario">

        <p>Senha:</p>
        <input type="password" id="txSenha">

        <p>Confirmar Senha:</p>
        <input type="password" id="txConfirmarSenha">

        <br><br>
        <button id="btVerificar">Verificar</button>

        <!-- Onde todas as mensagens de texto e cores vão aparecer -->
        <div id="mensagem" style="margin-top: 15px; font-weight: bold;"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
